{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2>➕ Nova Tarefa</h2>
    <p>Crie uma nova atividade para seus estudos</p>
</div>

<form method="POST" style="max-width: 600px; margin: 0 auto;">
    <div class="form-group">
        <label><i class="fas fa-heading"></i> Título da Tarefa</label>
        <input type="text" id="title" name="title" required 
               placeholder="Ex: Estudar Python, Fazer exercícios..." 
               class="form-control">
    </div>
    
    <div class="form-group">
        <label><i class="fas fa-flag"></i> Prioridade</label>
        <select id="priority" name="priority" class="form-control">
            <option value="alta" style="color: #f87171;">🔴 Alta - Urgente</option>
            <option value="media" selected style="color: #fbbf24;">🟡 Média - Importante</option>
            <option value="baixa" style="color: #34d399;">🟢 Baixa - Normal</option>
        </select>
    </div>
    
    <div class="form-group">
        <label><i class="fas fa-calendar"></i> Data Limite</label>
        <input type="date" id="due_date" name="due_date" class="form-control">
    </div>
    
    <div class="btn-group" style="justify-content: center; margin-top: 32px;">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Salvar Tarefa
        </button>
        <a href="/tasks" class="btn btn-outline">
            <i class="fas fa-times"></i> Cancelar
        </a>
    </div>
</form>
{% endblock %}
