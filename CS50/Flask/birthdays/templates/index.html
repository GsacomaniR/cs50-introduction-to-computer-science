<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Birthday Tracker</h1>

        <!-- Form to add new birthdays -->
        <div class="add-birthday">
            <h2>Add a Birthday</h2>
            <form action="/" method="post">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="number" name="month" placeholder="Month (1-12)" min="1" max="12" required>
                </div>
                <div class="form-group">
                    <input type="number" name="day" placeholder="Day (1-31)" min="1" max="31" required>
                </div>
                <button type="submit">Add Birthday</button>
            </form>
        </div>

        <!-- Table to display birthdays -->
        <div class="birthday-list">
            <h2>Birthday List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Birthday</th>
                        {% if request.endpoint != 'delete' %}
                        <th>Actions</th>
                        {% endif %}
                    </tr>
                </thead>
                <tbody>
                    {% for birthday in birthdays %}
                    <tr>
                        <td>{{ birthday.name }}</td>
                        <td>{{ birthday.month }}/{{ birthday.day }}</td>
                        <td class="actions">
                            <!-- Delete button -->
                            <form action="/delete/{{ birthday.id }}" method="post" style="display: inline;">
                                <button type="submit" class="delete-btn" onclick="return confirm('Are you sure?')">Delete</button>
                            </form>

                            <!-- Edit button (opens edit form) -->
                            <button onclick="showEditForm({{ birthday.id }}, '{{ birthday.name }}', {{ birthday.month }}, {{ birthday.day }})" class="edit-btn">Edit</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Hidden edit form (appears when edit button is clicked) -->
        <div id="editForm" class="edit-form" style="display: none;">
            <h2>Edit Birthday</h2>
            <form id="editFormElement" method="post">
                <div class="form-group">
                    <input type="text" name="name" id="editName" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="number" name="month" id="editMonth" placeholder="Month" min="1" max="12" required>
                </div>
                <div class="form-group">
                    <input type="number" name="day" id="editDay" placeholder="Day" min="1" max="31" required>
                </div>
                <button type="submit">Save Changes</button>
                <button type="button" onclick="hideEditForm()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        function showEditForm(id, name, month, day) {
            const editForm = document.getElementById('editForm');
            const editFormElement = document.getElementById('editFormElement');

            // Set form action
            editFormElement.action = '/edit/' + id;

            // Fill form fields
            document.getElementById('editName').value = name;
            document.getElementById('editMonth').value = month;
            document.getElementById('editDay').value = day;

            // Show form
            editForm.style.display = 'block';

            // Scroll to form
            editForm.scrollIntoView({ behavior: 'smooth' });
        }

        function hideEditForm() {
            document.getElementById('editForm').style.display = 'none';
        }
    </script>
</body>
</html>
